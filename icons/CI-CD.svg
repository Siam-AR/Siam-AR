<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <defs>
    <style><![CDATA[
      .badge-ch-label {
        fill: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 23px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .badge-ci-label {
        fill: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -1px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    ]]></style>
  </defs>

  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled Up & Centered Diagram (108px diameter, perfectly filling the badge with clean 10px margins) -->
    <g transform="translate(64, 64) scale(0.27)">
      <!-- Enlarged Central Inner Hub for Maximum CI/CD Visibility -->
      <circle cx="0" cy="0" r="96" fill="#1E2330"/>

      <!-- 5 Proportional Chevrons with Dark Tile Separator Lines -->
      <g stroke="#242938" stroke-width="7" stroke-linejoin="round">
        <!-- Code (Crimson) -->
        <path fill="#B81D24" d="M -190.2 -61.8 A 200 200 0 0 1 -0.0 -200.0 L 33.3 -144.2 L -0.0 -96.0 A 96 96 0 0 0 -91.3 -29.7 L -126.9 -76.2 Z"/>
        <!-- Build (Orange) -->
        <path fill="#E6511E" d="M -0.0 -200.0 A 200 200 0 0 1 190.2 -61.8 L 147.4 -12.9 L 91.3 -29.7 A 96 96 0 0 0 -0.0 -96.0 L 33.3 -144.2 Z"/>
        <!-- Test (Green) -->
        <path fill="#22A05D" d="M 190.2 -61.8 A 200 200 0 0 1 117.6 161.8 L 57.8 136.2 L 56.4 77.7 A 96 96 0 0 0 91.3 -29.7 L 147.4 -12.9 Z"/>
        <!-- Release (Blue) -->
        <path fill="#1898D6" d="M 117.6 161.8 A 200 200 0 0 1 -117.6 161.8 L -111.7 97.1 L -56.4 77.7 A 96 96 0 0 0 56.4 77.7 L 57.8 136.2 Z"/>
        <!-- Deploy (Amber) -->
        <path fill="#F5A623" d="M -117.6 161.8 A 200 200 0 0 1 -190.2 -61.8 L -126.9 -76.2 L -91.3 -29.7 A 96 96 0 0 0 -56.4 77.7 L -111.7 97.1 Z"/>
      </g>

      <!-- Chevron Labels Perfectly Centered in Each Band Segment -->
      <text x="-87.0"  y="-119.7" class="badge-ch-label">Code</text>
      <text x="87.0"   y="-119.7" class="badge-ch-label">Build</text>
      <text x="140.8"  y="45.7"   class="badge-ch-label">Test</text>
      <text x="0.0"    y="148.0"  class="badge-ch-label">Release</text>
      <text x="-140.8" y="45.7"   class="badge-ch-label">Deploy</text>

      <!-- Prominent, Enlarged CI/CD Central Typography -->
      <text x="0" y="0" class="badge-ci-label">CI/CD</text>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>
</svg>
