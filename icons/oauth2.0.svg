<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled & Perfectly Centered OAuth 2.0 Emblem + Wordmark -->
    <g transform="translate(64, 50)">
      <!-- Official OAuth Lock & Linked Orbit Rings Emblem -->
      <g transform="scale(0.85)">
        <!-- Connected Ring Nodes -->
        <!-- Outer Left Orbit Node -->
        <circle cx="-22" cy="-6" r="6.5" fill="#EB5424"/>
        
        <!-- Center Primary Lock Core -->
        <circle cx="0" cy="-14" r="11" fill="#FFFFFF"/>
        <path d="M-5,-14 A5,5 0 0,1 5,-14 L5,-9 L-5,-9 Z" fill="none" stroke="#242938" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="-6.5" y="-9" width="13" height="9" rx="2" fill="#242938"/>
        <circle cx="0" cy="-4.5" r="1.4" fill="#FFFFFF"/>

        <!-- Outer Right Orbit Node -->
        <circle cx="22" cy="-6" r="6.5" fill="#EB5424"/>

        <!-- Bottom Base Node -->
        <circle cx="0" cy="14" r="6.5" fill="#38BDF8"/>

        <!-- Interconnecting Vector Flow Lines -->
        <path d="M-17,-8 L-8,-12" stroke="#EB5424" stroke-width="3" stroke-linecap="round"/>
        <path d="M17,-8 L8,-12" stroke="#EB5424" stroke-width="3" stroke-linecap="round"/>
        <path d="M-18,-1 L-5,10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M18,-1 L5,10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Clear, High-Contrast Typography Centered Below -->
      <text 
        x="0" 
        y="46" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14.5" 
        font-weight="800" 
        letter-spacing="0.5px">OAuth 2.0</text>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>
</svg>
