<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <style>
      @keyframes tailwindFloat {
        0%, 100% {
          transform: translateY(0px) scale(1.15);
        }
        50% {
          transform: translateY(-5px) scale(1.18);
        }
      }
      .tailwind-waves {
        animation: tailwindFloat 2.4s ease-in-out infinite;
        transform-origin: 200px 75px;
      }
    </style>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="400" height="220" rx="14" fill="#0B1120"/>

  <!-- Larger Official Twin Waves with Float Animation & Reduced Gap -->
  <g class="tailwind-waves" fill="#38BDF8">
    <path d="M200 42c-23.5 0-39 11.7-46.8 35.1 8.9-11.7 19.5-16.1 32.2-13.2 7.2 1.6 12.4 6.9 18.2 12.9 9.5 9.8 20.3 20.7 44.2 20.7 23.5 0 39-11.7 46.8-35.1-8.9 11.7-19.5 16.1-32.2 13.2-7.2-1.6-12.4-6.9-18.2-12.9-9.5-9.8-20.3-20.7-44.2-20.7z"/>
    <path d="M138 74c-23.5 0-39 11.7-46.8 35.1 8.9-11.7 19.5-16.1 32.2-13.2 7.2 1.6 12.4 6.9 18.2 12.9 9.5 9.8 20.3 20.7 44.2 20.7 23.5 0 39-11.7 46.8-35.1-8.9 11.7-19.5 16.1-32.2 13.2-7.2-1.6-12.4-6.9-18.2-12.9-9.5-9.8-20.3-20.7-44.2-20.7z"/>
  </g>

  <!-- Tailwind CSS Wordmark Positioned Closer to the Icon -->
  <text 
    x="200" 
    y="172" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
    font-size="42" 
    font-weight="800" 
    letter-spacing="-1">Tailwind CSS</text>
</svg>
