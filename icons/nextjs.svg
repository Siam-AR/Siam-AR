<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <defs>
    <mask id="nextjs-vert-mask">
      <circle cx="90" cy="90" r="90" fill="#FFFFFF"/>
    </mask>
    <linearGradient id="nextjs-vert-b" x1="109" x2="144.5" y1="116.5" y2="160.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nextjs-vert-c" x1="121" x2="120.799" y1="54" y2="106.875" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled Up & Balanced Content Layout -->
    <g transform="translate(64, 52)">
      <!-- Top: Circular Next.js "N" Emblem -->
      <g transform="translate(0, -9) scale(0.39) translate(-90, -90)">
        <!-- Outer Contrast White Ring -->
        <circle cx="90" cy="90" r="88" fill="#000000" stroke="#FFFFFF" stroke-width="4"/>

        <!-- Masked "N" Letterform with Authentic Gradients -->
        <g mask="url(#nextjs-vert-mask)">
          <circle cx="90" cy="90" r="90" fill="#000000"/>
          <path fill="url(#nextjs-vert-b)" d="M149.508 157.52 69.142 54H54v71.97h12.114V69.384l73.885 95.461a90 90 0 0 0 9.509-7.325"/>
          <path fill="url(#nextjs-vert-c)" d="M115 54h12v72h-12z"/>
        </g>
      </g>

      <!-- Bottom: Large, High-Impact NEXT.js Typography -->
      <text 
        x="0" 
        y="55" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="20.5" 
        font-weight="900" 
        letter-spacing="0.6px">NEXT<tspan font-size="16" font-weight="700" letter-spacing="0.2px">.js</tspan></text>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>
</svg>
