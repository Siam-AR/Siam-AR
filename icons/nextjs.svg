<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled & Centered Next.js Icon (76x76 footprint) -->
    <g transform="translate(26, 26) scale(0.4222)">
      <!-- Next.js Dark Circular Base with Subtle Border for Contrast -->
      <circle cx="90" cy="90" r="88" fill="#000000" stroke="#2D333B" stroke-width="3"/>

      <!-- Next.js Masked "N" Letterform with Gradients -->
      <g mask="url(#nextjs-mask)">
        <circle cx="90" cy="90" r="90" fill="#000000"/>
        <path fill="url(#nextjs-b)" d="M149.508 157.52 69.142 54H54v71.97h12.114V69.384l73.885 95.461a90 90 0 0 0 9.509-7.325"/>
        <path fill="url(#nextjs-c)" d="M115 54h12v72h-12z"/>
      </g>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>

  <defs>
    <mask id="nextjs-mask">
      <circle cx="90" cy="90" r="90" fill="#FFFFFF"/>
    </mask>
    <linearGradient id="nextjs-b" x1="109" x2="144.5" y1="116.5" y2="160.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nextjs-c" x1="121" x2="120.799" y1="54" y2="106.875" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
