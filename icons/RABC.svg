<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled & Perfectly Centered RBAC (Role-Based Access Control) Shield & Key Emblem -->
    <g transform="translate(64, 50)">
      <!-- Security Shield with User Role & Access Key Hierarchy -->
      <g transform="scale(0.88)">
        <!-- Outer Security Shield -->
        <path d="M0 -34 L26 -22 C26 4 14 20 0 28 C-14 20 -26 4 -26 -22 Z" 
              fill="none" 
              stroke="#38BDF8" 
              stroke-width="3.2" 
              stroke-linejoin="round"/>

        <!-- User Role Profile (Head & Torso) -->
        <circle cx="0" cy="-14" r="6" fill="#38BDF8"/>
        <path d="M-11 3 C-11 -4 -4 -7 0 -7 C4 -7 11 -4 11 3 Z" fill="#38BDF8"/>

        <!-- Access Permission Key Accent -->
        <g transform="translate(13, 7) scale(0.65)">
          <circle cx="0" cy="0" r="7" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
          <path d="M5 5 L16 16 M12 12 L15 9 M15 15 L18 12" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Bold High-Contrast "RBAC" Typography Centered Below -->
      <text 
        x="0" 
        y="46" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="1px">RBAC</text>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>
</svg>
