<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled & Perfectly Centered CSS3 Shield + White Typography (Matches HTML5 Proportions) -->
    <g transform="translate(64, 64) scale(0.165) translate(-256, -256)">
      <!-- Shield Base (Left side dark blue) -->
      <polygon points="107.644,470.877 74.633,100.62 437.367,100.62 404.321,470.819 255.778,512" fill="#264DE4"/>

      <!-- Shield Right Side (Lighter blue) -->
      <polygon points="376.03,447.246 404.27,130.894 256,130.894 256,480.523" fill="#2965F1"/>

      <!-- '3' Letterform - Left side parts (Light Gray) -->
      <polygon points="150.31,268.217 154.38,313.627 256,313.627 256,268.217" fill="#EBEBEB"/>
      <polygon points="146.26,221.716 256,221.716 256,176.305 255.843,176.305 142.132,176.305" fill="#EBEBEB"/>
      <polygon points="255.791,433.457 256,433.399 256,386.153 255.801,386.206 205.227,372.55 201.994,336.333 177.419,336.333 156.409,336.333 162.771,407.634" fill="#EBEBEB"/>

      <!-- Top Typography: "CSS" (Pure White for Dark Badge Contrast) -->
      <g fill="#FFFFFF">
        <path d="M160 0h55v23h-32v23h32v23h-55z"/>
        <path d="M226 0h55v20h-32v4h32v46h-55V49h32v-4h-32z"/>
        <path d="M292 0h55v20h-32v4h32v46h-55V49h32v-4h-32z"/>
      </g>

      <!-- '3' Letterform - Right side (Pure White) -->
      <polygon points="369.597,176.305 255.843,176.305 255.843,221.716 319.831,221.716 315.699,268.217 255.843,268.217 255.843,313.627 311.761,313.627 306.49,372.521 255.843,386.191 255.843,433.435 348.937,407.634 349.62,399.962 360.291,280.411 361.399,268.217" fill="#FFFFFF"/>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>
</svg>
