      <polygon points="146.26,221.716 256,221.716 256,176.305 255.843,176.305 142.132,176.305" fill="#EBEBEB"/>
      <polygon points="255.791,433.457 256,433.399 256,386.153 255.801,386.206 205.227,372.55 201.994,336.333 177.419,336.333 156.409,336.333 162.771,407.634" fill="#EBEBEB"/>

