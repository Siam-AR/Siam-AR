<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="55" height="55">
  <!-- Unified Dark Tile Badge with SMIL Float Animation -->
  <g>
    <!-- Standard Rounded Badge Base (#242938) -->
    <rect width="128" height="128" rx="24" fill="#242938"/>

    <!-- Scaled & Centered Python Double Snakes (Occupies balanced ~72x72 box) -->
    <g transform="translate(64, 64) scale(0.72) translate(-64, -64)">
      <!-- Blue Snake Upper -->
      <path fill="#38BDF8" d="M63.6 10c-26 0-24.4 11.3-24.4 11.3l.03 11.7h24.8v3.5H30.4S15 34.7 15 60.5s13.5 24.8 13.5 24.8h8.1v-11.4s-.4-13.5 13.3-13.5h22.9s12.8.2 12.8-12.4V22.4S89.2 10 63.6 10zm-13.3 7.3a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4z"/>
      
      <!-- Yellow Snake Lower -->
      <path fill="#FFD43B" d="M64.4 118c26 0 24.4-11.3 24.4-11.3l-.03-11.7H64v-3.5h33.6s15.4 1.8 15.4-24S99.5 44 99.5 44h-8.1v11.4s.4 13.5-13.3 13.5H55.2s-12.8-.2-12.8 12.4v24.6s-3.6 12.1 22 12.1zm13.3-7.3a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4z"/>
    </g>

    <!-- Synced SMIL Floating Animation Loop -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0" 
      dur="2.4s" 
      repeatCount="indefinite"/>
  </g>
</svg>
